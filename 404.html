<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page introuvable — Association du Quartier du Barrou</title>
<meta http-equiv="refresh" content="4;url=/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: radial-gradient(ellipse at top right, rgba(207,110,74,.18), transparent 60%),
                radial-gradient(ellipse at bottom left, rgba(42,111,134,.14), transparent 60%),
                #fbf6ef;
    color: #2a2018;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
  }
  .card {
    max-width: 520px;
  }
  .mark {
    width: 72px; height: 72px;
    background: #b8542f;
    color: #fff;
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: "Fraunces", serif;
    font-size: 2rem; font-weight: 600;
    margin: 0 auto 1.5rem;
    box-shadow: 0 4px 12px rgba(42,32,24,.12);
  }
  h1 {
    font-family: "Fraunces", serif;
    font-size: 4rem;
    color: #b8542f;
    margin: 0 0 .3rem;
    font-weight: 500;
  }
  h2 {
    font-family: "Fraunces", serif;
    font-size: 1.6rem;
    margin: 0 0 1rem;
    font-weight: 500;
  }
  p { color: #5a4a3d; line-height: 1.5; margin: 0 0 1rem;}
  a {
    display: inline-block;
    background: #b8542f;
    color: #fff;
    text-decoration: none;
    padding: .8rem 1.6rem;
    border-radius: 12px;
    font-weight: 600;
    margin-top: 1rem;
    transition: background .2s;
  }
  a:hover { background: #9a4322; }
  .small { font-size: .85rem; color: #8a7768; margin-top: 2rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">B</div>
    <h1>404</h1>
    <h2>Cette page n'existe pas</h2>
    <p>Elle a peut-être été déplacée, renommée, ou vous avez suivi un lien qui n'est plus valide.</p>
    <a href="/">Retour à l'accueil</a>
    <p class="small">Redirection automatique dans 4 secondes…</p>
  </div>
</body>
</html>
